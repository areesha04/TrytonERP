[database]
# Make sure to include the database name at the end
uri = postgresql://postgres:admin@localhost:5432/tryton

[web]
listen = localhost:8000

[server]
# Timezone must be set under [server], not [modules]
timezone = UTC

[modules]
# Use absolute path; on Windows you can use forward slashes or double backslashes
path = D:/tryton-workspace/tryton-modules,D:/tryton-workspace/trytond
